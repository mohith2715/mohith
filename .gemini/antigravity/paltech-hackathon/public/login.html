<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
<style>
        body { font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar from Shared Components -->
<header class="bg-surface dark:bg-on-background flex justify-between items-center w-full px-margin-mobile h-14 docked full-width top-0 z-50">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary dark:text-on-primary" data-icon="lightbulb">lightbulb</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">IdeaFlow</h1>
</div>
<div class="w-10"></div> <!-- Spacer for center-alignment if needed -->
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-[480px] px-margin-mobile flex flex-col pt-xl">
<!-- Welcome Section -->
<section class="mb-xl text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container rounded-full mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lock_person">lock_person</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Please sign in to access your vault</p>
</section>
<!-- Login Form -->
<section class="flex flex-col gap-lg bg-surface-container-lowest p-lg rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)]">
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail">mail</span>
<input class="w-full h-12 pl-11 pr-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-secondary focus:ring-1 focus:ring-secondary font-body-md text-body-md placeholder:text-outline/50 outline-none transition-all" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Password</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="key">key</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-secondary focus:ring-1 focus:ring-secondary font-body-md text-body-md placeholder:text-outline/50 outline-none transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-md text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-label-md" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-xs">
<a class="font-label-sm text-label-sm text-secondary font-bold hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
</div>
<!-- Log In Button -->
<button class="mt-md h-14 bg-primary text-on-primary rounded-xl font-label-md text-label-md font-bold shadow-sm active:scale-95 transition-transform duration-150 flex items-center justify-center gap-base" type="submit">
                    Log In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-md py-xs">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
</section>
<!-- Footer Signup Link -->
<section class="mt-xl text-center pb-xl">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-secondary font-bold hover:underline ml-xs" href="#">Sign Up</a>
</p>
</section>
<!-- Bottom Security Image Decor -->
<div class="w-full flex justify-center mt-auto mb-lg">
<img alt="Security Concept" class="w-full h-24 object-cover rounded-xl opacity-40 grayscale" data-alt="A macro shot of a sleek, brushed metal surface reflecting subtle blue and silver light. The composition is clean and minimalist, representing the high-tech security and professional clarity of the IdeaFlow application. Soft light gradients move across the texture, creating a sense of depth and precision engineering. The overall mood is cold, reliable, and extremely secure." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDklE9_kLrQbxtbLK25swxKtjvGcPTbYnJ6qRRbDPNrennbqqIAA851yBMATVqk5duV_3pYcRoHqji1d_y7YRSP4J5M92DJqBakkoqZB8NG-Miy8Te9UIaMk4RPHAsoI5ySUnspS8tWIpUusoryiBXd5HPHGCenPcZTFfv6nmP3c9mmSoo5WJ8PTpv5vWDrpq3lJjLppUa6QO7VImI8VHx7b8GFqq8gwuIn4MRmbEpCk0Fb9ygRGD89OPK4vByV2ziSuxkUuzinHb8"/>
</div>
</main>
<!-- Navigation suppressed per 'Transactional' rule in instructions -->
<script src="/app.js"></script></body></html>
